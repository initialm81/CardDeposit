<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>카드입금</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#14201d;--sub:#63716d;--line:#e3e8e6;--brand:#0f766e;--brand-ink:#fff;--soft:#e2f3f0;--red:#c2410c;--blue:#1d4ed8;--warn-bg:#fff4e0;--warn-ink:#8a4b00}
@media (prefers-color-scheme:dark){:root{--bg:#0e1513;--card:#18211f;--ink:#e8efed;--sub:#93a19d;--line:#2a3532;--brand:#2bb3a6;--brand-ink:#04211e;--soft:#16312d;--red:#fb923c;--blue:#7da2ff;--warn-bg:#3a2a10;--warn-ink:#ffd08a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif}
body{padding-bottom:72px}
header{background:#0f766e;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:700}
header small{display:block;font-weight:400;opacity:.8;font-size:11px}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:18px;padding:7px 13px;font-size:13px}
main{padding:12px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card h2{font-size:13px;color:var(--sub);margin:0 0 8px;font-weight:600}
.hero{background:var(--brand);color:var(--brand-ink);border:0}
.hero h2{color:inherit;opacity:.85}
.hero .big{font-size:34px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.hero .big span{font-size:18px;font-weight:600;margin-left:2px}
.hero p{margin:4px 0 0;font-size:13px;opacity:.9}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--sub);font-weight:600;text-align:right;padding:4px 0;border-bottom:1px solid var(--line)}
td{padding:8px 0;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
th:first-child,td:first-child{text-align:left}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
td small{display:block;color:var(--sub);font-size:11px}
.fee{color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent;font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{font-variant-numeric:tabular-nums}
.btn{display:inline-block;background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--line)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:10px 0 12px;color:var(--sub);font-size:12px}
nav button i{display:block;font-style:normal;font-size:19px;line-height:1.2}
nav button.on{color:var(--brand);font-weight:700}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mnav b{font-size:17px}
.mnav button{background:var(--soft);color:var(--ink);border:0;border-radius:10px;width:40px;height:36px;font-size:18px}
.sum3{display:flex;gap:8px;margin-bottom:10px}
.sum3 div{flex:1;background:var(--soft);border-radius:10px;padding:8px 6px;text-align:center}
.sum3 small{display:block;font-size:11px;color:var(--sub)}
.sum3 b{font-size:14px;font-variant-numeric:tabular-nums}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .h{font-size:11px;color:var(--sub);text-align:center;padding:2px 0}
.cal .d{min-height:52px;border-radius:8px;background:var(--bg);padding:3px 2px;text-align:center;border:1.5px solid transparent;overflow:hidden}
.cal .d.x{background:none}
.cal .d em{display:block;font-style:normal;font-size:12px;color:var(--sub)}
.cal .d.off em{color:var(--red)}
.cal .d.sat em{color:var(--blue)}
.cal .d b{display:block;font-size:10px;letter-spacing:-.4px;color:var(--brand);font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap}
.cal .d s{display:block;text-decoration:none;font-size:9px;letter-spacing:-.4px;color:var(--sub);white-space:nowrap}
.cal .d.today{border-color:var(--brand)}
.cal .d.sel{background:var(--soft)}
label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
select,input,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font:inherit}
td input{width:64px;padding:6px;text-align:right}
textarea{min-height:90px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips span{background:var(--soft);border-radius:14px;padding:4px 10px;font-size:12px}
.inline{display:flex;gap:8px;align-items:center}
.inline>*{flex:1}.inline>.btn{flex:0 0 auto}
p.note{font-size:12px;color:var(--sub);margin:8px 0 0}
</style>
</head>
<body>
<header><h1>카드입금<small id="sub"></small></h1><button data-act="scan">↻ 문자 확인</button></header>
<main id="view"></main>
<nav>
  <button data-tab="today"><i>₩</i>오늘</button>
  <button data-tab="cal"><i>▦</i>캘린더</button>
  <button data-tab="set"><i>⚙</i>설정</button>
</nav>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
